plugins {
	id "com.gradleup.shadow"
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common

	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	implementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

	compileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
	compileOnly "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
	localRuntime "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

	def alexJar = rootProject.file("libs/alexsmobsfabric-26.2-1.0.0.jar")
	def citadelJar = rootProject.file("libs/citadelfabric-26.2-1.0.0.jar")
	if (alexJar.exists() && citadelJar.exists()) {
		localRuntime files(citadelJar, alexJar)
	}

	def weaponModJar = rootProject.file("libs/weaponmod-fabric-26.2-1.25.0.jar")
	if (weaponModJar.exists()) {
		localRuntime files(weaponModJar)
	}

	common(project(":common")) { transitive false }
	shadowBundle project(path: ":common", configuration: "transformProductionFabric")
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

jar {
	archiveClassifier = "raw"
}

shadowJar {
	exclude "architectury.common.json"
	dependsOn jar
	mainSpec.sourcePaths.clear()
	from(zipTree(jar.archiveFile))
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = "fabric"
}

assemble.dependsOn shadowJar

configurations {
	apiElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
	runtimeElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
}

sourcesJar {
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

publishing {
	publications {
		mavenFabric(MavenPublication) {
			artifactId = rootProject.archives_base_name + "-fabric"
			from components.java
		}
	}
}
